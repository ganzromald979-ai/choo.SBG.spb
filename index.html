<style>
  :root {
    --bg: #08090a;
    --bg-elevated: #0e1012;
    --card: #131518;
    --card-hover: #181a1e;
    --line: #26292e;
    --line-gold: rgba(214, 180, 91, 0.28);
    --gold: #d6b45b;
    --gold-light: #edd48e;
    --gold-dark: #9c7b2f;
    --krap: #7a1c25;
    --krap-light: #9e2733;
    --text: #f2f0ea;
    --muted: #9e9c96;
    --max: 1220px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 clamp(20px, 4vw, 36px); }
  section { padding: clamp(72px, 8vw, 110px) 0; position: relative; }
  h1, h2, h3, h4 { line-height: 1.18; font-weight: 700; letter-spacing: -0.01em; }

  /* --- ВЕРХНЯЯ ПАНЕЛЬ / HEADER --- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 9, 10, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 86px;
    gap: 20px;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .header-logo svg { height: 46px; width: auto; }
  .header-logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .header-logo-text span {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .header-logo-text b {
    font-size: 22px;
    color: var(--gold);
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  nav ul {
    display: flex;
    gap: clamp(18px, 2.5vw, 32px);
    list-style: none;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.1px;
  }
  nav a { transition: color 0.25s; position: relative; padding: 4px 0; }
  nav a:hover { color: var(--gold-light); }

  .header-right { display: flex; align-items: center; gap: 20px; }
  .header-phone {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.2;
  }
  .header-phone a {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    transition: color 0.25s;
  }
  .header-phone a:hover { color: var(--gold); }
  .header-phone small {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.5px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 26px;
    border-radius: 2px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    text-transform: uppercase;
    letter-spacing: 1.1px;
  }
  .btn-gold {
    background: linear-gradient(135deg, #c29e47, #e6cc82);
    color: #12100a;
  }
  .btn-gold:hover {
    background: linear-gradient(135deg, #e6cc82, #c29e47);
    box-shadow: 0 6px 20px rgba(214, 180, 91, 0.22);
  }
  .btn-krap {
    background: var(--krap);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.08);
  }
  .btn-krap:hover {
    background: var(--krap-light);
    box-shadow: 0 6px 20px rgba(122, 28, 37, 0.35);
  }
  .btn-outline {
    background: transparent;
    border-color: var(--line);
    color: var(--text);
  }
  .btn-outline:hover {
    border-color: var(--gold);
    color: var(--gold-light);
  }

  .burger {
    display: none;
    background: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--gold);
    font-size: 20px;
    width: 42px;
    height: 42px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* --- ЗАГОЛОВКИ СЕКЦИЙ --- */
  .sec-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .sec-label::before {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    background: var(--krap-light);
  }
  .sec-title {
    font-size: clamp(26px, 3.4vw, 38px);
    margin-bottom: 18px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sec-title em { color: var(--gold-light); font-style: normal; }
  .sec-desc {
    color: var(--muted);
    margin-bottom: 48px;
    max-width: 660px;
    font-size: 16px;
  }

  .hero {
    background:
      radial-gradient(circle at 82% 35%, rgba(122, 28, 37, 0.18), transparent 45%),
      radial-gradient(circle at 15% 80%, rgba(214, 180, 91, 0.06), transparent 40%),
      linear-gradient(180deg, #0d0f11 0%, #08090a 100%);
    border-bottom: 1px solid var(--line);
    padding: clamp(64px, 8vw, 112px) 0 72px;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.25fr 0.75fr;
    gap: clamp(32px, 5vw, 72px);
    align-items: center;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(122, 28, 37, 0.16);
    border: 1px solid rgba(158, 39, 51, 0.45);
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    margin-bottom: 24px;
  }
  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }
  .hero h1 {
    font-size: clamp(34px, 4.8vw, 56px);
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.08;
  }
  .hero h1 span {
    color: var(--gold);
    display: block;
    font-size: 0.72em;
    margin-top: 10px;
    letter-spacing: 4px;
    font-weight: 700;
  }
  .hero p {
    color: #c2bfb8;
    font-size: 17px;
    margin-bottom: 38px;
    max-width: 560px;
    border-left: 2px solid var(--krap-light);
    padding-left: 20px;
    line-height: 1.75;
  }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }

  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .shield-frame {
    width: 100%;
    max-width: 310px;
    aspect-ratio: 1 / 1.08;
    background: radial-gradient(circle, rgba(214, 180, 91, 0.08) 0%, rgba(19, 21, 24, 0.6) 70%);
    border: 1px solid var(--line);
    border-top: 2px solid var(--gold);
    border-bottom: 2px solid var(--krap);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }
  .shield-frame svg {
    width: 165px;
    height: auto;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
  }
  .shield-caption {
    margin-top: 22px;
    text-align: center;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    width: 100%;
  }
  .shield-caption b {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .shield-caption span {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 68px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 2px solid var(--gold);
    border-radius: 2px;
    padding: 24px;
    transition: border-color 0.25s, transform 0.25s;
  }
  .stat:hover {
    border-color: var(--line-gold);
    transform: translateY(-3px);
  }
  .stat b {
    display: block;
    font-size: 30px;
    color: var(--gold-light);
    line-height: 1.1;
    margin-bottom: 8px;
    font-weight: 800;
  }
  .stat small {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* --- О КОМПАНИИ --- */
  .about-grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 56px;
    align-items: start;
  }
  .about-text p {
    color: var(--muted);
    margin-bottom: 18px;
    font-size: 16px;
  }
  .about-text p strong { color: var(--text); font-weight: 600; }

  .about-principles {
    display: grid;
    gap: 14px;
  }
  .principle-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--krap);
    padding: 20px 24px;
    border-radius: 2px;
  }
  .principle-card h4 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--gold-light);
    margin-bottom: 6px;
  }
  .principle-card p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }

  /* --- УСЛУГИ --- */
  .services-sec {
    background: var(--bg-elevated);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
